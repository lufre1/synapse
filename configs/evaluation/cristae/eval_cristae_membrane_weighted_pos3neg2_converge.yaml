# Eval for the pos3-neg2 membrane-proximity weighted cristae run, PRODUCTION CONVERGENCE checkpoint.
# Training config: configs/training/cristae/cristae_membrane_weighted_pos3neg2_converge.yaml
#
# Same recipe as eval_cristae_membrane_weighted_wneg2.yaml (the 2026-07-27 pos3-neg2 checkpoint,
# current champion on junction detection), but for the re-run over the ENLARGED 164-file train
# pool (fidi_cristae_h5combined_2026-07, 4 files, confirmed landed in train not test/val).
#
# Judge this run on band8 / band12 AP, NOT on the headline 'all' AP: cristae in the membrane shell
# are a median 2% of crista voxels, so 'all' is nearly blind to what the weighting changes
# (evaluation/cristae/RESULTS_cristae_junction_band_ap.md). Success = band AP up (or at least not
# regressing) vs. the 2026-07-27 checkpoint below, with core/all AP not regressing either.
# Baseline to beat: the unweighted bs24 allfiles run, all-AP 0.832.
# Reigning champion to beat on junction/band AP: cristae-net32-...-membw-pos3-neg2-band12-2026-07-27
#   (mito_with_junction 4.2% -> 54.2% at 8nm vs. the unweighted baseline).
#
# Same pinned 15-file test split as every other cristae eval, so the numbers stay comparable.
#
# Submit chained to fire after training SUCCEEDS:
#   python sbatch_runner.py configs/evaluation/cristae/eval_cristae_membrane_weighted_pos3neg2_converge.yaml --dependency afterok:<TRAIN_JOBID>

# grete_shared, not grete_interactive: the `interactive` QOS caps at 2 jobs per user, which an
# interactive session alone can exhaust. grete:shared has the same A100 and no practical cap.
slurm_profile: grete_shared

env:
  type: micromamba
  path: /mnt/vast-nhr/home/freckmann15/u12103/micromamba/envs/synapse

commands:
  - python ${REPO}/inference/cristae/segment_cristae.py -c ${SELF}
  - python ${REPO}/evaluation/cristae/evaluate_cristae.py -c ${SELF}
  - python ${REPO}/evaluation/cristae/evaluate_cristae_ap.py -c ${SELF}

model_path: /mnt/lustre-grete/usr/u12103/cristae/checkpoints/cristae-net32-lr1.7e-4-bs24-ps32x256x256-membw-pos3-neg2-band12-2026-07-31
export_path: &export_path /mnt/lustre-grete/usr/u12103/cristae/test_segmentations/cristae-net32-lr1.7e-4-bs24-ps32x256x256-membw-pos3-neg2-band12-2026-07-31
tile_shape: [32, 256, 256]
save_predictions: true   # save pred/foreground so evaluate_cristae_ap.py can reuse it
band_nm: [8, 12]   # THE metric for this run: AP inside/outside the mito-membrane shell
erosion_distance_nm: 0.0   # pin it: the June exports were made when this defaulted to 10 nm, which
                           # erodes the mito mask by ~6 voxels and deletes the band being measured

h5_paths:  # pinned test split (SYNAPSENETV1_TEST_SPLIT, 15 files; Otof_455L repointed to needs_corrections)
  - /mnt/lustre-grete/usr/u12103/cristae_data/wichmann/inital_data/WT22_eb5_model2_combined.h5
  - /mnt/lustre-grete/usr/u12103/cristae_data/wichmann/inital_data/WT40_eb10_model_combined.h5
  - /mnt/lustre-grete/usr/u12103/cristae_data/wichmann/inital_data/M5_eb1_model_combined.h5
  - /mnt/lustre-grete/usr/u12103/mitochondria/cooper/cristae/2026/36859_J1_66K_TS_PS_03_rec_2kb1dawbp_crop_combined.h5
  - /mnt/lustre-grete/usr/u12103/mitochondria/cooper/cristae/2026/36194_B4_66K_TS_SC_22_rec_crop_combined.h5
  - /mnt/lustre-grete/usr/u12103/cristae_data/wichmann/inital_data/WT21_eb5_model2_combined.h5
  - /mnt/lustre-grete/usr/u12103/cristae_data/wichmann/inital_data/KO8_eb4_model_combined.h5
  - /mnt/lustre-grete/usr/u12103/cristae_data/wichmann_needs_corrections/2026-05-26-dataset/Otof_AVCN07_455L_KO_M.Stim_B3_2_35933_combined.h5
  - /mnt/lustre-grete/usr/u12103/cristae_data/wichmann/inital_data/M8_eb6_model_combined.h5
  - /mnt/lustre-grete/usr/u12103/cristae_data/wichmann/inital_data/WT20_eb5_model2_combined.h5
  - /mnt/lustre-grete/usr/u12103/cristae_data/wichmann/inital_data/M1_eb6_model_combined.h5
  - /mnt/lustre-grete/usr/u12103/cristae_data/wichmann/inital_data/M2_eb5_model_combined.h5
  - /mnt/lustre-grete/usr/u12103/cristae_data/wichmann/inital_data/Otof_AVCN03_429A_WT_M.Stim_D3_4model_combined.h5
  - /mnt/lustre-grete/usr/u12103/mitochondria/cooper/cristae/2026/36194_B4_66K_TS_R01A_SC_01_rec_crop_combined.h5
  - /mnt/lustre-grete/usr/u12103/cristae_data/wichmann/inital_data/WT21_syn4_model2_combined.h5

key: labels/cristae
segmentations_key: seg
output_path: *export_path   # directory; evaluate_cristae.py writes cristae_eval_results.csv inside
