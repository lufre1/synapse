# Cristae training — membrane-proximity WEIGHTED loss, run B (DOSE-RESPONSE).
#
# Same objective as run A (cristae_membrane_weighted_wpos3.yaml): emphasise GT cristae inside the
# 12 nm band next to the mitochondrial membrane, where the headline AP is nearly blind — cristae in
# contact with the membrane shell are a median 2% of crista voxels
# (evaluation/cristae/RESULTS_cristae_junction_band_ap.md).
#
# Delta vs run A: membrane_w_pos 3.0 -> 6.0. Nothing else changes.
#
# Why this run exists: measured on real training patches, only 1.4-2.0% of crista voxels fall inside
# the 12 nm band, so w_pos=3 may be too gentle a nudge to move the band metric at all. If A shows a
# small effect in the right direction, this says whether it scales. If A shows nothing, this says
# whether the lever is simply too weak rather than the idea being wrong.
#
# Run this AFTER A, not in parallel — its interpretation depends on A's result.
#
# Run:  python sbatch_runner.py configs/training/cristae/cristae_membrane_weighted_wpos6.yaml
# Eval: configs/evaluation/cristae/eval_cristae_membrane_weighted_wpos6.yaml  (uses band_nm: [8, 12])

slurm_profile: grete_shared_80gb

env:
  type: micromamba
  path: /mnt/vast-nhr/home/freckmann15/u12103/micromamba/envs/synapse

script: "training/cristae/train_cristae.py"
args:
  experiment_name: "cristae-net32-lr1.7e-4-bs24-ps32x256x256-membw-pos6-neg1-band12-2026-07-27"
  # ---- membrane-proximity weighting (the ONLY delta vs the bs24 allfiles baseline) ----
  membrane_w_pos: 6.0
  membrane_w_neg: 1.0
  membrane_band_nm: 12.0            # ~7 voxels at 1.74 nm; covers 1.4-2.0% of crista voxels
  membrane_offset_nm: 0.0           # band starts at the mito mask surface
  membrane_voxel_size: [1.74, 1.74, 1.74]
  # ---- baseline recipe, unchanged ----
  batch_size: 24
  learning_rate: 1.7e-4
  loss_variant: "persample"         # required: the weight is carried in the target
  augmentations: true
  split_strategy: "legacy"
  data_dir: "/scratch-grete/projects/nim00007/data/mitochondria/cooper/raw_mito_combined_s2"
  data_dir2: "/mnt/lustre-grete/usr/u12103/mitochondria/cooper/cristae"
  data_dir3: "/mnt/lustre-grete/usr/u12103/cristae_data/wichmann/"
  data_dir4: "/mnt/lustre-grete/usr/u12103/cristae_data/wichmann_needs_corrections/"
  patch_shape: [32, 256, 256]
  n_iterations: 100000
  feature_size: 32
  ignore_state_value: 2
  state_channel: 1
  test_split: "synapsenetv1-testsplit"
  early_stopping: 25
  seed: 42
  num_workers: 8
  persistent_workers: true
  prefetch_factor: 4
