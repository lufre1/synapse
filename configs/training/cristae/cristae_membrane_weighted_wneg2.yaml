# Cristae training — membrane-proximity WEIGHTED loss, run C (MEMBRANE SUPPRESSION).
#
# Delta vs run A (cristae_membrane_weighted_wpos3.yaml): membrane_w_neg 1.0 -> 2.0, i.e. NON-cristae
# voxels inside the 12 nm band — the membrane itself and the matrix beside it — also count double.
# Targets the other reported failure mode: the membrane predicted as a crista.
#
# READ THIS BEFORE INTERPRETING: this is a DIFFERENT objective from A, not a stronger version of it,
# and it partly works AGAINST A. Measured on real training patches, the 12 nm band is ~99%
# GT-negative and covers 24-41% of the mito interior, while only 1.4-2.0% of crista voxels fall
# inside it. So w_neg touches roughly 40x more voxels than w_pos: raising it is a large increase in
# the false-positive penalty near the membrane, which pushes the model to predict LESS there.
#
# The risk is concrete: RESULTS_cristae_junction_audit.md found only 42.5% of GT crista instances
# touching the 8 nm shell, where biologically nearly all should connect. If the annotations stop
# short of the membrane, a real crista junction is GT-NEGATIVE inside the band and w_neg=2.0
# actively punishes predicting it — trading the FN failure mode worse to make the FP one better.
#
# Run this only after A, and judge it on band recall/precision separately, not on band AP alone.
#
# Run:  python sbatch_runner.py configs/training/cristae/cristae_membrane_weighted_wneg2.yaml
# Eval: configs/evaluation/cristae/eval_cristae_membrane_weighted_wneg2.yaml  (uses band_nm: [8, 12])

slurm_profile: grete_shared_80gb

env:
  type: micromamba
  path: /mnt/vast-nhr/home/freckmann15/u12103/micromamba/envs/synapse

script: "training/cristae/train_cristae.py"
args:
  experiment_name: "cristae-net32-lr1.7e-4-bs24-ps32x256x256-membw-pos3-neg2-band12-2026-07-27"
  # ---- membrane-proximity weighting (the ONLY delta vs the bs24 allfiles baseline) ----
  membrane_w_pos: 3.0
  membrane_w_neg: 2.0
  membrane_band_nm: 12.0            # ~7 voxels at 1.74 nm; covers 1.4-2.0% of crista voxels
  membrane_offset_nm: 0.0           # band starts at the mito mask surface
  membrane_voxel_size: [1.74, 1.74, 1.74]
  # ---- baseline recipe, unchanged ----
  batch_size: 24
  learning_rate: 1.7e-4
  loss_variant: "persample"         # required: the weight is carried in the target
  augmentations: true
  split_strategy: "legacy"
  data_dir: "/scratch-grete/projects/nim00007/data/mitochondria/cooper/raw_mito_combined_s2"
  data_dir2: "/mnt/lustre-grete/usr/u12103/mitochondria/cooper/cristae"
  data_dir3: "/mnt/lustre-grete/usr/u12103/cristae_data/wichmann/"
  data_dir4: "/mnt/lustre-grete/usr/u12103/cristae_data/wichmann_needs_corrections/"
  patch_shape: [32, 256, 256]
  n_iterations: 100000
  feature_size: 32
  ignore_state_value: 2
  state_channel: 1
  test_split: "synapsenetv1-testsplit"
  early_stopping: 25
  seed: 42
  num_workers: 8
  persistent_workers: true
  prefetch_factor: 4
